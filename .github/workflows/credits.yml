# Updates the credits wall every day: the Credits section of README.md and the
# whole of CREDITS.md, counted from the public issues. It commits only when the
# counts changed. A failed run writes nothing, and the old credits stay.
#
# The accounts to leave out are in the repository secret CREDITS_EXCLUDE
# (Settings > Secrets and variables > Actions > Secrets). A secret, not a
# variable: a run log on a public repo shows variables in plain text and masks
# secrets. Without it the script refuses, so nobody who asked to be left out
# ever appears.

name: Credits

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: credits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Count the issues and write the credits
        env:
          GH_TOKEN: ${{ github.token }}
          CREDITS_EXCLUDE: ${{ secrets.CREDITS_EXCLUDE }}
        run: node .github/scripts/credits.mjs --readme README.md --credits CREDITS.md

      - name: Commit when something changed
        run: |
          if git diff --quiet -- README.md CREDITS.md; then
            echo "The credits did not change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CREDITS.md
          git commit -m 'Credits: daily update'
          git push
