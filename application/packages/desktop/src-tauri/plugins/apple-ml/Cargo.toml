[package]
name = "tauri-plugin-apple-ml"
version = "0.1.0"
description = "Apple's on-device engines (Vision, VisionKit and SpeechAnalyzer) in the iOS and macOS apps"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-apple-ml"
publish = false

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0.8"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
swift-rs = { version = "1.0.8", features = ["build"] }
