[package]
name = "privacynotes"
version = "0.780.8"
description = "PrivacyNotes - private notes, encrypted on your device"
authors = ["Lifetime Labs LLC <hi@lifetimelabs.dev>"]
homepage = "https://privacynotes.app"
edition = "2021"
# Matches the toolchain the four release-*.yml workflows pin - bump all five together.
# The floor comes from the tree, not from Tauri's own MSRV: tauri-plugin-iap needs
# 1.90 and time/serde_with need 1.88, so cargo rejects anything older outright.
# A floor below the true one is not harmless - it advertises Windows 7 support (the
# last Rust with it was 1.77.2) that no shipped build has ever had.
# Spec: docs/contrib/gotchas.md (pinned release toolchains)
rust-version = "1.97.0"

[lib]
name = "privacynotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# For the iOS entitlements append in build.rs: the helper that finds and
# rewrites the generated entitlements file, and the plist types it hands over.
# Mac hosts only, because only a Mac builds iOS and the helper exists nowhere else.
[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
plist = "1"
serde_json = "1"

[dependencies]
# Pinned to the 2.12 minor: Tauri's build rejects a Rust-crate vs @tauri-apps/api
# major.minor mismatch. Bump this together with @tauri-apps/api in package.json.
# protocol-asset backs the `assetProtocol` block in tauri.conf.json, which is
# how the Markdown pillar will render an image a note references by relative
# path. Enabling the config without this feature is a build error, by design.
# Spec: docs/internal/specs/markdown-folder.md (section 8, media)
tauri = { version = "~2.12", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Calendar reminders: a local notification each device schedules from its own
# items (phones), or shows from a timer while the app runs (desktop). The
# server never sees a title, a time or a day.
# Spec: docs/internal/specs/calendar-pillar-spec.md (section 8)
tauri-plugin-notification = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The web clipper's native download (src/clip_fetch.rs). reqwest, rustls,
# url and tokio are already in the tree through tauri and its updater; this
# names them directly with only the features the command needs: no proxy,
# no cookies, no HTTP/2, the ring provider, and the connection pinned to an
# address the command checked.
# Spec: docs/internal/specs/web-clipper-stage1.md (section 3.1)
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
tokio = { version = "1", features = ["net", "time"] }
# Certificates are checked offline against the Mozilla root list on every
# platform: a platform verifier may download a missing issuer certificate
# from an address the site names, which no address check covers.
webpki-roots = "1"
# The hash of a staged backup and of the placed file read back
# (src/backup_dest.rs). Already in the tree through tauri-codegen; this names
# it directly.
# Spec: docs/internal/plans/auto-backup.md (section 7)
sha2 = "0.10"
# A backup piece from Android's web view arrives as base64 text
# (backup_dest_chunk). Already in the tree through tauri; this names it.
base64 = "0.22"

# Self-updater is desktop-only (macOS/Windows/Linux). iOS/Android update
# through their app stores, and the plugin won't compile for those targets.
# single-instance (with the deep-link feature) forwards privacynotes://
# OAuth callbacks to the already-running instance so a second on-disk copy
# of the app can't launch fresh and swallow the redirect.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-process = "2"
# The Ninja key from any app (src/ninja.rs). Registered from Rust only: the
# web view gets no permission of this plugin, so a script cannot take keys.
# Spec: docs/internal/plans/ninja-anywhere-694.md (section 2)
tauri-plugin-global-shortcut = "2"
# Open at login (Settings > System, src/autostart.rs): a LaunchAgent on macOS,
# the Run key on Windows, an autostart .desktop file on Linux. Called directly,
# not through tauri-plugin-autostart, so the LaunchAgent names our bundle id
# and macOS lists it as PrivacyNotes. Driven from Rust commands only.
# Spec: docs/internal/plans/ninja-anywhere-694.md (section 7)
auto-launch = "0.6"
tauri-plugin-window-state = "2"
# The fs grants carry no static allow, so the folder the user picked
# lives only in the runtime scope; this saves that scope and restores it at
# the next start. Exact pin: 2.4.1 and later need tauri-plugin-fs 2.7, and the
# fs plugin moves together with @tauri-apps/plugin-fs and the copy of its
# `is_forbidden` in tests/fs_scope_casefold.rs. No JS package: it has no
# commands, and the webview gets no permission for it.
# Spec: docs/internal/plans/desktop-fs-casefold.md (section 2, option A)
tauri-plugin-persisted-scope = "=2.4.0"

# Native biometric gate (src/biometric.rs). Embedded webviews expose no WebAuthn
# platform authenticator, so that path is dead in every native build and the OS
# APIs are the replacement: LocalAuthentication here, Windows Hello below.
# Every crate involved is already in the tree via tauri/tao/wry, so these add
# dependency edges and features, never packages.
# Spec: docs/contrib/biometric-unlock.md, backlog #101
[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
# tests/fs_scope_casefold.rs builds the fs plugin's scope on a mock app, and
# matches deny globs the way the plugin does. Both are already in the tree.
# Spec: docs/internal/plans/desktop-fs-casefold.md (section 4)
tauri = { version = "~2.12", features = ["test"] }
glob = "0.3"

# AVIF pictures on Linux (src/avif.rs): WebKitGTK there has no AVIF decoder.
# avif-native is dav1d, built from source and linked statically through
# SYSTEM_DEPS_DAV1D_BUILD_INTERNAL in .cargo/config.toml, because Ubuntu
# 22.04 (the release runner) ships a dav1d older than the binding accepts.
# Spec: docs/contrib/gotchas.md (AppImage AVIF)
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["avif-native", "png"] }
# The Ninja box on GNOME (src/ninja.rs): a window shown again gets the focus
# only with the X server's current time. Both are in the tree through Tauri.
gtk = "0.18"
gdkx11 = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# geteuid, for the single-instance rendezvous owner check in lib.rs.
# Already in the tree through tao and wry; this names it directly.
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# NSGeometry + objc2-core-foundation are for src/print.rs (view frames, and the
# iPad popover anchor). Both are already in the tree via tao/wry, so this turns
# features on rather than adding packages.
objc2-foundation = { version = "0.3", features = [
  "NSError",
  "NSString",
  "NSGeometry",
  "objc2-core-foundation",
  # src/share_inbox.rs: the app group folder the iOS share extension writes.
  "NSFileManager",
  "NSURL",
] }

# windows-future carries IAsyncOperation, which the UserConsentVerifier interop
# returns; the `windows` crate re-exports nothing for it.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  # src/biometric.rs, the bound key: KeyCredentialManager, and the buffers its
  # challenge and signature travel in.
  "Security_Credentials",
  "Security_Credentials_UI",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  # src/title_bar.rs: DwmSetWindowAttribute paints the title bar in the theme.
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_WinRT",
  # src/file_assoc.rs: AssocQueryStringW reads which app owns .md, and
  # ShellExecuteW opens the Default apps page in Settings. Windows forbids an app
  # setting its own default, so reading and signposting is the whole surface.
  # Spec: docs/internal/specs/markdown-folder.md (section 11)
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # src/cli_install.rs: the folder of the pn launcher goes on the user PATH
  # (HKCU\Environment), then WM_SETTINGCHANGE tells running programs.
  # Spec: docs/internal/plans/agent-cli.md (section 3.7)
  "Win32_System_Registry",
] }
windows-future = "0.3"
# src/lib.rs disable_browser_accelerator_keys: the WebView2 settings interface
# that turns off the webview's own browser keys (F5, Ctrl+R, Ctrl+P). The same
# version Tauri's runtime already builds against.
# Spec: docs/internal/specs/keyboard-shortcuts.md (decision D8)
webview2-com = "0.39"

# The third biometric backend. Android has no OS-level API this crate can call
# directly: BiometricPrompt is Kotlin, and it needs an Activity to attach to, so
# the gate has to ship a native library alongside the Rust. That is what this
# plugin is - androidx.biometric behind the same two calls the other two
# backends expose (src/biometric.rs). Its commands are never granted to the
# webview: only our own `biometric_available` / `biometric_authenticate` reach
# it, from Rust.
# Spec: docs/contrib/biometric-unlock.md (section 3.2 native path)
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2"
# The bound key: an Android Keystore key a strong biometric
# releases through a CryptoObject, which the plugin above cannot do. Our own
# Kotlin, reached from src/biometric.rs only.
# Spec: docs/internal/plans/biometric-key-binding.md (section 8.2)
tauri-plugin-biometric-key = { path = "plugins/biometric-key" }

# Native in-app purchase: StoreKit (iOS) + Google Play Billing (Android) via one
# plugin. The notarized DMG / Windows / Linux never compile it. The macOS App
# Store build adds it for macOS under the `mas` feature (MAS track).
# Spec: docs/internal/billing-integration.md
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-iap = "0.9"
# One position reading for "Use my current location" in a note's place
# popover. Phones only: the plugin has no desktop build. It asks for the
# permission inside the call, never when it loads, so nothing asks at launch.
# Spec: docs/internal/plans/note-location.md (section 3)
tauri-plugin-geolocation = "2.5"
# The folder automatic backups go to on a phone: a tree URI on Android, a
# security-scoped bookmark on iOS. Our own Kotlin and Swift, reached from
# src/backup_dest.rs only; desktop writes the folder with std::fs.
# Spec: docs/internal/plans/auto-backup.md (section 7)
tauri-plugin-backup-folder = { path = "plugins/backup-folder" }

# In-app OAuth presentation (ASWebAuthenticationSession). iOS only: App Review
# guideline 4 rejects sign-in that bounces through the external browser
# (rejected 2026-08-22), and the session sheet is Apple's sanctioned fix.
# Android keeps the system-browser + App Link flow, so the plugin is not
# compiled there. A path dependency, never the registry crate: the fork in
# plugins/auth-session completes the sheet on an https return address bound
# to this app, and no version bump may swap the custom scheme back in.
# Spec: docs/internal/plans/oauth-redirect-binding-handoff.md (section 8.2)
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-auth-session = { path = "plugins/auth-session" }

# swift-rs compiles the Swift half of every Tauri iOS plugin. Xcode 27 keeps a
# Swift package's C entry points internal, and 1.0.8 re-exports them for each
# package's own object but not for the shared runtime shim, so the iOS link
# fails on _retain_object and friends. patches/swift-rs is 1.0.8 plus the
# two-line fix of upstream pull request 82. Drop the directory and this
# section once a release carries the fix. Only the iOS targets compile it.
[patch.crates-io]
swift-rs = { path = "patches/swift-rs" }
# patches/tauri-plugin-notification is 2.5.1 with two iOS fixes (2.6.0
# carries neither): a scheduled time is read as UTC, not in the device zone,
# and a notification a previous launch scheduled no longer crashes the app
# when it is delivered or tapped. It also adds `open_settings`, which opens
# the OS page for this app's notifications on Android and iOS; a release that
# carries both fixes still needs that command before the patch can go.
tauri-plugin-notification = { path = "patches/tauri-plugin-notification" }

[features]
default = []
devtools = ["tauri/devtools"]

# A byte range over a `str` panics when it ends inside a character, and with
# `panic = "abort"` below that ends the process. Launch arguments, file names
# and URLs all come from outside, so compare bytes (`as_bytes().get(..n)`)
# instead; a slice that is provably on a boundary carries an `expect` with
# its reason.
[lints.clippy]
string_slice = "deny"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = false

[profile.dev.package."*"]
debug = false
