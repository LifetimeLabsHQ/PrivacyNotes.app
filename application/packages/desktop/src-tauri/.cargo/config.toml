# dav1d for the Linux-only `image` dependency (src/avif.rs): build it from
# source and link it statically. Ubuntu 22.04, the release runner, ships a
# dav1d older than dav1d-sys accepts, and a static copy means the .deb and the
# AppImage need no library on the user's system. Needs meson, ninja and (on
# x86_64) nasm. Other targets never build dav1d-sys, so this does nothing there.
# Spec: docs/contrib/gotchas.md (AppImage AVIF)
[env]
SYSTEM_DEPS_DAV1D_BUILD_INTERNAL = "always"
