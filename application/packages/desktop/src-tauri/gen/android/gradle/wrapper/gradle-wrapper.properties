distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The SHA-256 Gradle publishes beside the zip (<distributionUrl>.sha256): the
# wrapper refuses a download with other bytes. A wrapper upgrade changes both lines.
distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
